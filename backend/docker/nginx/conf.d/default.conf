upstream backend_service {
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Standard API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Rate-limited Knowledge Refresh endpoint
    location /api/v1/knowledge/refresh {
        limit_req zone=refresh_limit burst=2 nodelay;
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # OKF Dedicated Route & Latency Benchmark Logging (Standard Buffering)
    location /api/v1/chat/okf {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_service;
        
        # Dedicated OKF access log with latency metrics
        access_log /var/log/nginx/okf_access.log ai_benchmarking;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # RAG Dedicated Route & Latency Benchmark Logging (Standard Buffering)
    location /api/v1/chat/rag {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_service;
        
        # Dedicated RAG access log with latency metrics
        access_log /var/log/nginx/rag_access.log ai_benchmarking;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Standard chat endpoint
    location /api/v1/chat {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_service;
        access_log /var/log/nginx/access.log ai_benchmarking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical SSE streaming directives
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # Health check for Nginx itself
    location /health {
        return 200 '{"status":"healthy","service":"nginx"}';
        add_header Content-Type application/json;
    }
}

